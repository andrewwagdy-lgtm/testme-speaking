<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speaking Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 30px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background-color: #ffffff;
      color: #333333;
    }
    .hidden { display: none !important; }
    .timer {
      font-size: 2.8rem;
      font-weight: bold;
      color: #d9534f;
      margin: 15px 0;
      text-align: center;
    }
    .prompt-box {
      background: #f8f9fa;
      padding: 24px;
      border-left: 6px solid #0275d8;
      border-radius: 4px;
      margin: 20px 0;
      font-size: 1.25rem;
      line-height: 1.6;
      text-align: center;
    }
    .prompt-box img {
      max-width: 100%;
      height: auto;
      max-height: 400px;
      border-radius: 6px;
    }
    label { font-weight: 600; display: block; margin-top: 15px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: #0275d8;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    #status-indicator {
      font-size: 1.2rem;
      font-weight: 600;
      color: #555;
      text-align: center;
    }
    #error-banner {
      background: #f8d7da;
      color: #721c24;
      padding: 14px 18px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: left;
    }
    /* Loading UI */
    .loading-container {
      text-align: center;
      padding: 30px 10px;
    }
    .progress-bar-container {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 20px;
      height: 16px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0275d8, #5bc0de, #0275d8);
      background-size: 200% 100%;
      animation: loadingAnimation 1.5s infinite linear;
    }
    @keyframes loadingAnimation {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .logo-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-header img {
      display: inline-block;
    }
    .logo-login {
      width: 260px;
      max-width: 80%;
      height: auto;
    }
    .logo-small {
      width: 26px; /* 10% of the 260px login logo */
      height: auto;
    }
    #step-user h2 {
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Step 1: User Info -->
  <div id="step-user">
    <div class="logo-header">
      <img src="https://od.lk/s/NzhfODIyODg1MTFf/test-me-caption-small.png" alt="TestMe Logo" class="logo-login">
    </div>
    <h2>Speaking Test</h2>
    <h3>Student Details</h3>
    <label for="studentId">Student ID:</label>
    <input type="text" id="studentId" placeholder="e.g. ST-1004" required>

    <label for="studentName">Student Name:</label>
    <input type="text" id="studentName" placeholder="e.g. John Doe" required>

    <button id="start-btn">Start Test</button>
  </div>

  <!-- Step 2: Task Execution -->
  <div id="step-task" class="hidden">
    <div class="logo-header">
      <img src="https://od.lk/s/NzhfODIyODg1MTFf/test-me-caption-small.png" alt="TestMe Logo" class="logo-small">
    </div>
    <h3 id="task-title">Loading Task...</h3>
    <div id="status-indicator">Preparation Phase</div>
    <div class="timer" id="timer-display">10</div>
    <div class="prompt-box" id="prompt-container"></div>
  </div>

  <!-- Step 3: Loading / Saving Indicator -->
  <div id="step-loading" class="hidden">
    <div class="logo-header">
      <img src="https://od.lk/s/NzhfODIyODg1MTFf/test-me-caption-small.png" alt="TestMe Logo" class="logo-small">
    </div>
    <div class="loading-container">
      <h3>Please wait...</h3>
      <p id="loading-subtext">Saving recordings and submitting your responses.</p>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
      <div id="error-banner" class="hidden"></div>
    </div>
  </div>

  <!-- Step 4: Complete -->
  <div id="step-complete" class="hidden">
    <div class="logo-header">
      <img src="https://od.lk/s/NzhfODIyODg1MTFf/test-me-caption-small.png" alt="TestMe Logo" class="logo-small">
    </div>
    <div style="background-color: #d4edda; color: #155724; padding: 20px; border-radius: 6px; text-align: center;">
      <h3>Assessment Completed</h3>
      <p>Your responses and audio recordings have been successfully saved.</p>
    </div>
  </div>


  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgkXOqBHI7NsJsaAr2LdAZDh6mQv391fgVpaCD66imBaQwnc1w1udHduLfMUU22UT-/exec";
    let itemBank = [];
    let currentTaskIndex = 0;
    let studentId = "";
    let studentName = "";

    let mediaStream = null;
    let mediaRecorder = null;
    let audioChunks = [];

    let recognition = null;
    let currentLiveTranscript = "";

    let completedTasks = [];
    let pendingUploadPromises = [];
    let currentInterval = null;
    let uploadErrors = [];

    // Helper: Pick a random item from an array
    function getRandomItem(arr) {
      if (!arr || arr.length === 0) return null;
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // Helper: fetch with a timeout and a few retries, so a transient
    // network blip (or an Apps Script "echo" redirect glitch) doesn't get
    // reported as a hard failure. Retries on network errors AND on
    // responses that fail to parse as JSON (e.g. Apps Script occasionally
    // serves an HTML error page instead of the expected JSON).
    async function fetchJsonWithRetry(url, options, { retries = 3, timeoutMs = 20000, label = "request" } = {}) {
      let lastErr;
      for (let attempt = 1; attempt <= retries; attempt++) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { ...options, signal: controller.signal });
          clearTimeout(timeoutId);
          const text = await res.text();
          try {
            return JSON.parse(text);
          } catch (parseErr) {
            throw new Error(`Non-JSON response (status ${res.status}): ${text.slice(0, 120)}`);
          }
        } catch (err) {
          clearTimeout(timeoutId);
          const isTimeout = err.name === 'AbortError';
          lastErr = isTimeout
            ? new Error(`${label} timed out after ${timeoutMs / 1000}s`)
            : err;
          console.warn(`${label} attempt ${attempt}/${retries} failed:`, lastErr);
          if (attempt < retries) {
            await new Promise(r => setTimeout(r, attempt * 1000)); // backoff: 1s, 2s...
          }
        }
      }
      throw lastErr;
    }

    // Helper: extract a Google Drive file ID from any common link format
    // (share link, uc?id=, thumbnail link) or a bare file ID.
    function extractDriveFileId(url) {
      if (!url) return null;
      const str = String(url).trim();
      let match = str.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
      if (match) return match[1];
      match = str.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9_-]{20,}$/.test(str)) return str;
      return null;
    }

    // Helper: build a reliable inline-embeddable image URL for a Drive file,
    // plus a fallback URL to try if the primary one fails to load.
    function buildDriveImageUrls(rawUrl) {
      const id = extractDriveFileId(rawUrl);
      if (!id) {
        // Not a recognizable Drive link/ID — use as-is (e.g. Unsplash URLs).
        return { primary: rawUrl, fallback: rawUrl };
      }
      return {
        primary: `https://drive.google.com/thumbnail?id=${id}&sz=w1600`,
        fallback: `https://lh3.googleusercontent.com/d/${id}`
      };
    }

    // Initialize Native Browser Speech Recognition
    function setupRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;

      const r = new SpeechRecognition();
      r.continuous = true;
      r.interimResults = true;
      r.lang = 'en-US';
      r.onresult = (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript + ' ';
        }
        currentLiveTranscript = transcript.trim();
      };
      r.onerror = (e) => {
        console.warn("Speech recognition error:", e.error);
      };
      return r;
    }

    document.getElementById('start-btn').addEventListener('click', async () => {
      const startBtn = document.getElementById('start-btn');
      studentId = document.getElementById('studentId').value.trim();
      studentName = document.getElementById('studentName').value.trim();
      if (!studentId || !studentName) {
        alert("Please enter both Student ID and Name.");
        return;
      }
      startBtn.disabled = true;
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      } catch (err) {
        alert("Microphone permission is required to proceed.");
        startBtn.disabled = false;
        return;
      }
      let rawBank = [];
      try {
        const data = await fetchJsonWithRetry(APPS_SCRIPT_URL + "?api=getItems", {}, { label: "getItems", timeoutMs: 20000, retries: 3 });
        if (data.status === "success" && data.items && data.items.length > 0) {
          rawBank = data.items;
        } else {
          throw new Error("Empty bank");
        }
      } catch (e) {
        console.warn("Falling back to built-in item bank:", e);
        rawBank = [
          { id: 1, type: "read_aloud", content: "I walk to school every day. My teacher is very strict about the schedule. Lately, I've really enjoyed practicing my English more. Still, reconciling academic commitments with personal downtime often proves considerably more demanding than one might initially assume." },
          { id: 2, type: "read_aloud", content: "I cook dinner every night. My mother taught me some simple recipes. Lately, I've really enjoyed trying new ingredients and flavors. Still, mastering more elaborate techniques often proves considerably trickier than cookbooks tend to suggest." },
          { id: 3, type: "picture_desc", content: "https://drive.google.com/file/d/1YIKJES7kCrRrzStODTMwifYwFFlryBK0/view?usp=sharing" },
          { id: 4, type: "picture_desc", content: "https://drive.google.com/file/d/1Emp1AXDjLgcVTBQTWWF356iO8c6ksJ3R/view?usp=drive_link" }
        ];
      }
      // Filter tasks by type and pick one random task from each pool
      const readAloudPool = rawBank.filter(item => item.type === "read_aloud");
      const pictureDescPool = rawBank.filter(item => item.type === "picture_desc");
      const selectedReadAloud = getRandomItem(readAloudPool);
      const selectedPictureDesc = getRandomItem(pictureDescPool);
      itemBank = [];
      if (selectedReadAloud) itemBank.push(selectedReadAloud);
      if (selectedPictureDesc) itemBank.push(selectedPictureDesc);
      document.getElementById('step-user').classList.add('hidden');
      document.getElementById('step-task').classList.remove('hidden');
      runTask();
    });

    function clearActiveTimer() {
      if (currentInterval !== null) {
        clearInterval(currentInterval);
        currentInterval = null;
      }
    }

    function runTask() {
      clearActiveTimer();
      if (currentTaskIndex >= itemBank.length) {
        finalizeAssessment();
        return;
      }
      const item = itemBank[currentTaskIndex];
      const titleEl = document.getElementById('task-title');
      const promptEl = document.getElementById('prompt-container');
      const statusEl = document.getElementById('status-indicator');
      const timerEl = document.getElementById('timer-display');
      let prepDuration = 10;
      let recordDuration = 30;
      if (item.type === 'read_aloud') {
        titleEl.textContent = `Task ${currentTaskIndex + 1}: Read Aloud`;
        promptEl.innerHTML = `<p>"${item.content}"</p>`;
        prepDuration = 10;
      } else if (item.type === 'picture_desc') {
        titleEl.textContent = `Task ${currentTaskIndex + 1}: Describe the Picture`;
        const { primary, fallback } = buildDriveImageUrls(item.content);
        promptEl.innerHTML = `<img src="${primary}" data-fallback="${fallback}" alt="Task Image" onerror="if(!this.dataset.triedFallback){this.dataset.triedFallback='1';this.src=this.dataset.fallback;}" />`;
        prepDuration = 15;
      }
      statusEl.textContent = "⏳ Preparation Time";
      let prepTime = prepDuration;
      timerEl.textContent = prepTime;
      currentInterval = setInterval(() => {
        prepTime--;
        timerEl.textContent = prepTime;
        if (prepTime <= 0) {
          clearActiveTimer();
          startRecordingPhase(item, recordDuration);
        }
      }, 1000);
    }

    function startRecordingPhase(item, recordDuration) {
      clearActiveTimer();
      const statusEl = document.getElementById('status-indicator');
      const timerEl = document.getElementById('timer-display');
      audioChunks = [];
      currentLiveTranscript = "";
      mediaRecorder.start();
      recognition = setupRecognition();
      if (recognition) {
        try { recognition.start(); } catch(e) {}
      }
      statusEl.textContent = "🔴 Recording... Speak Now!";
      let recordTime = recordDuration;
      timerEl.textContent = recordTime;
      currentInterval = setInterval(() => {
        recordTime--;
        timerEl.textContent = recordTime;
        if (recordTime <= 0) {
          clearActiveTimer();
          stopTask(item);
        }
      }, 1000);
    }

    function stopTask(item) {
      clearActiveTimer();

      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const capturedTranscript = currentLiveTranscript || "[No speech detected]";
        const fileName = `${studentId}_Task${currentTaskIndex + 1}.webm`;
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = () => {
          const base64Audio = reader.result;

          const uploadPromise = fetchJsonWithRetry(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'saveRecording',
              base64Audio: base64Audio,
              mimeType: 'audio/webm',
              fileName: fileName,
              transcript: capturedTranscript
            })
          }, { label: `saveRecording (${fileName})`, timeoutMs: 60000, retries: 3 })
          .then(fileData => {
            if (fileData.status === "error") {
              throw new Error(fileData.message || "Unknown error saving recording");
            }
            completedTasks.push({
              taskType: item.type,
              promptContent: item.content,
              fileName: fileData.fileName || fileName,
              audioUrl: fileData.downloadUrl || fileData.viewUrl,
              transcript: capturedTranscript
            });
          })
          .catch(err => {
            console.error(`Upload failed for ${fileName}:`, err);
            uploadErrors.push(`${fileName}: ${err.message || err}`);
            // Still record the task locally so the transcript isn't lost,
            // even though the audio upload failed.
            completedTasks.push({
              taskType: item.type,
              promptContent: item.content,
              fileName: fileName,
              audioUrl: "UPLOAD_FAILED",
              transcript: capturedTranscript
            });
          });

          pendingUploadPromises.push(uploadPromise);
          currentTaskIndex++;
          runTask();
        };
      };
    }

    async function finalizeAssessment() {
      clearActiveTimer();

      document.getElementById('step-task').classList.add('hidden');
      document.getElementById('step-loading').classList.remove('hidden');

      // Wait for all uploads to settle (success or failure) — never let a
      // rejected promise here freeze the app on the loading screen.
      await Promise.allSettled(pendingUploadPromises);

      const payload = {
        studentId: studentId,
        studentName: studentName,
        tasks: completedTasks
      };

      let submitFailed = false;
      try {
        const result = await fetchJsonWithRetry(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'submitFullTest',
            payload: payload
          })
        }, { label: "submitFullTest", timeoutMs: 30000, retries: 3 });
        if (result.status === "error") {
          throw new Error(result.message || "Unknown error submitting test");
        }
      } catch (err) {
        console.error("Submission error:", err);
        submitFailed = true;
        uploadErrors.push(`Final submission: ${err.message || err}`);
      }

      document.getElementById('step-loading').classList.add('hidden');

      if (uploadErrors.length > 0) {
        // Show completion screen but surface a warning banner instead of
        // hanging silently — the student/teacher can see something needs attention.
        const banner = document.getElementById('error-banner');
        banner.textContent = "Note: some items had trouble saving (" + uploadErrors.join("; ") + "). Please inform your administrator.";
        banner.classList.remove('hidden');
        document.getElementById('step-loading').classList.remove('hidden');
        document.getElementById('loading-subtext').textContent = submitFailed
          ? "There was a problem submitting your results."
          : "Your recordings were saved with some warnings.";
      } else {
        document.getElementById('step-complete').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
